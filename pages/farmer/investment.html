          image:

        },
      ];

      const container = document.getElementById("investmentContainer");
      const searchInput = document.getElementById("searchInput");
      const noResults = document.getElementById("noResults");
      document.getElementById("year").textContent = new Date().getFullYear();

      // Render investment cards
      function renderInvestments(investments) {
        container.innerHTML = "";
        if (investments.length === 0) {
          noResults.classList.remove("hidden");
          return;
        }
        noResults.classList.add("hidden");

        investments.forEach((inv) => {
          const card = document.createElement("div");
          card.className =
            "bg-white rounded-2xl shadow-md overflow-hidden flex flex-col w-full hover:shadow-xl transition duration-300";

          card.innerHTML = `
            <div class="h-48 w-full overflow-hidden">
              <img src="${inv.image}" alt="${inv.farmer}" class="h-full object-cover">
            </div>
            <div class="flex flex-col flex-1">
              <h2 class="text-lg font-semibold text-primary">${inv.farmer}</h2>
              <p class="text-sm text-gray-600">${inv.location}</p>
              <p class="text-sm text-gray-700 mt-3 flex-1">${inv.description}</p>

              <div class="mt-4 space-y-1 text-sm">
                <div class="flex justify-between">
                  <span class="text-gray-600">Goal:</span>
                  <span class="font-medium">$${inv.goal.toLocaleString()}</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-gray-600">Raised:</span>
                  <span class="font-medium">$${inv.raised.toLocaleString()}</span>
                </div>
                <div class="text-accent font-medium">ROI: ${inv.roi}</div>
              </div>

              <button class="mt-5 bg-red-500 text-white py-2 rounded-xl hover:opacity-90 transition w-full">
                Invest Now
              </button>
            </div>
          `;

          container.appendChild(card);
        });
      }

      // Search functionality
      searchInput.addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = investments.filter((inv) =>
          inv.farmer.toLowerCase().includes(term)
        );
        renderInvestments(filtered);
      });

      renderInvestments(investments);

      const menuToggle = document.getElementById("menu-toggle");
      const closeMenu = document.getElementById("close-menu");
      const sidebar = document.getElementById("sidebar");

      menuToggle.addEventListener("click", () => {
        sidebar.classList.toggle("-translate-x-full");
      });
    </script>
